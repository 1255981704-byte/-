<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGNITE // INFINITE HORIZON</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400;700&family=Rajdhani:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* =========================================
           UI PROTECTION ZONE
           ========================================= */
        :root {
            --stark-white: #ffffff;
            --stark-ice: #aeeeff; 
            --stark-cyan: #00f3ff;
            --stark-blue: #0077ff;
            --bg-deep: #010205; 
            
            /* 下一页的背景色，用于无缝衔接 */
            --next-page-bg: #000510; 
        }

        /* 
           设置底色为下一页的颜色。
           当 body 缩小消失时，用户会看到这个颜色，从而平滑过渡到下一页。
        */
        html {
            background: var(--next-page-bg);
            height: 100%;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            overflow: hidden; 
            background: var(--bg-deep); 
            margin: 0; padding: 0;
            opacity: 1; 
            height: 100%;
            user-select: none;
            cursor: default;
            transform-origin: center center; /* 确保缩小时向中心坍缩 */
            will-change: transform, opacity, filter;
        }

        /* ----------------------------------------------------
           动画：黑洞坍缩 (Implosion / Zoom Out)
           ---------------------------------------------------- */
        body.warping-out {
            /* 
               使用 ease-in (加速离开) 
               transform: 0.8s 缩小
               opacity: 0.8s 变黑
            */
            transition: 
                transform 0.8s cubic-bezier(0.55, 0, 0.1, 1),
                opacity 0.8s ease-in,
                filter 0.8s ease-in;
            
            /* 缩小至几乎消失 */
            transform: scale(0.01) perspective(500px) translateZ(-100px);
            
            /* 透明度归零 */
            opacity: 0;          
            
            /* 模糊并变暗，模拟光线被吸收 */
            filter: blur(10px) brightness(0);  
            
            pointer-events: none;
        }

        /* 入场遮罩层样式 */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 5000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none;
            animation: introFadeOut 0.8s ease-in-out 2.2s forwards;
        }
        .intro-text {
            font-family: 'Share Tech Mono'; color: var(--stark-ice); letter-spacing: 5px;
            font-size: 14px; margin-bottom: 20px;
            text-shadow: 0 0 10px var(--stark-cyan);
            animation: textGlitch 0.2s infinite;
        }
        .intro-bar-track {
            width: 200px; height: 2px; background: rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .intro-bar-fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%;
            background: var(--stark-cyan);
            box-shadow: 0 0 10px var(--stark-cyan);
            animation: loadProgress 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes introFadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes loadProgress { 0% { width: 0%; } 40% { width: 30%; } 100% { width: 100%; } }
        @keyframes textGlitch { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }

        /* SIDE HUD */
        .side-hud {
            position: fixed; left: 0; top: 0; height: 100%; width: 300px;
            background: linear-gradient(90deg, rgba(1, 3, 10, 0.95) 0%, rgba(1, 3, 10, 0.5) 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex; flex-direction: column; padding: 40px; box-sizing: border-box;
            z-index: 100;
            backdrop-filter: blur(8px);
            transform: translateX(-20px); opacity: 0;
            animation: hudSlideIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 2.2s forwards;
        }
        @keyframes hudSlideIn { to { transform: translateX(0); opacity: 1; } }

        .brand-wrapper { margin-bottom: 60px; cursor: pointer; }
        .eco-logo {
            font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 800;
            letter-spacing: 4px; color: #fff; line-height: 1;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        .eco-logo .highlight { color: #fff; font-weight: 800; }
        .brand-hint {
            font-family: 'Share Tech Mono'; font-size: 9px; color: var(--stark-ice);
            margin-top: 8px; opacity: 0.5; letter-spacing: 2px;
        }

        .hud-menu { display: flex; flex-direction: column; gap: 15px; flex-grow: 1; }
        
        .menu-item {
            font-family: 'Rajdhani'; font-weight: 700; font-size: 16px; color: #7a8296;
            padding: 15px 20px; cursor: pointer; display: flex; align-items: center; 
            border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            letter-spacing: 2px;
            background: rgba(255,255,255,0.02); position: relative; overflow: hidden;
        }
        .menu-item:hover {
            border-color: rgba(174, 238, 255, 0.3);
            background: rgba(174, 238, 255, 0.08);
            color: #fff;
            transform: translateX(5px);
            box-shadow: -4px 0 10px rgba(0, 243, 255, 0.1);
        }
        .menu-item.active {
            color: #fff; background: rgba(174, 238, 255, 0.05);
            border-color: var(--stark-ice); box-shadow: 0 0 15px rgba(174, 238, 255, 0.1);
        }
        .menu-item.active::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: #fff; box-shadow: 0 0 10px #fff;
        }

        /* Return Button */
        .return-btn {
            position: absolute; 
            bottom: 40px; 
            left: 40px; 
            width: 220px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px; text-align: center;
            font-family: 'Share Tech Mono'; font-size: 12px; letter-spacing: 2px;
            color: var(--stark-ice); cursor: pointer; transition: 0.3s;
            background: rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        .return-btn:hover { 
            background: rgba(255, 255, 255, 0.15); 
            color: #fff; 
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 0 15px rgba(255,255,255,0.1); 
        }

        /* TOP BAR */
        .top-bar {
            position: fixed; top: 0; right: 0; left: 300px; height: 100px;
            display: flex; justify-content: flex-end; align-items: center;
            padding: 0 60px; z-index: 90; pointer-events: none;
        }
        .user-profile {
            text-align: right; pointer-events: auto; opacity: 0; 
            animation: fadeInDown 0.8s ease 2.5s forwards;
        }
        @keyframes fadeInDown { to { opacity: 1; transform: translateY(0); } }
        .user-rank { font-size: 10px; color: var(--stark-ice); letter-spacing: 3px; font-family: 'Share Tech Mono'; margin-bottom: 4px; }
        .user-name { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* HOVER CARD */
        #hover-card {
            position: absolute; pointer-events: none; opacity: 0;
            width: 340px; 
            background: rgba(8, 12, 18, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-left: 4px solid var(--stark-cyan); 
            clip-path: polygon(0 0, 100% 0, 100% 90%, 92% 100%, 0 100%);
            padding: 25px; z-index: 200;
            transform: scale(0.95); transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        #hover-card.active { pointer-events: auto; opacity: 1; transform: scale(1); }
        
        #hover-card.locked-state {
            border-color: rgba(255, 51, 102, 0.5);
            border-left-color: #ff3366;
        }
        #hover-card.locked-state .status-badge {
            background: rgba(255, 51, 102, 0.2);
            color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        #hover-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: scanline 2s linear infinite; opacity: 0.3; pointer-events: none;
        }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

        .card-header { border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 10px; margin-bottom: 15px; }
        .card-title { font-family: 'Rajdhani'; font-weight: 800; font-size: 26px; color: #fff; letter-spacing: 2px; margin: 0; text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
        .card-sub { font-family: 'Share Tech Mono'; font-size: 10px; color: var(--stark-ice); letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .card-body { margin-bottom: 20px; }
        .card-desc { font-family: 'Noto Sans SC'; font-size: 13px; color: #bbb; line-height: 1.6; }
        .card-actions { display: flex; gap: 8px; margin-top: 15px; }
        .action-tag { 
            font-family: 'Share Tech Mono'; font-size: 9px; 
            padding: 4px 8px; border: 1px solid rgba(255,255,255,0.2); color: #888; 
            transition: 0.2s; cursor: default;
        }
        .action-tag:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .action-tag.active { border-color: var(--stark-ice); color: var(--stark-ice); background: rgba(174, 238, 255, 0.1); }
        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); color: #888; }
        .status-badge.active { background: rgba(174, 238, 255, 0.2); color: var(--stark-ice); box-shadow: 0 0 5px rgba(174, 238, 255, 0.2); }


        #galaxy-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            transform-origin: center center;
            opacity: 0;
            animation: galaxyArrival 2.5s cubic-bezier(0.19, 1, 0.22, 1) 1.5s forwards;

        @keyframes galaxyArrival {
            0% { opacity: 0; transform: scale(3); filter: blur(20px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        #starfield { position: absolute; top: 0; left: 0; }

        .hud-bottom {
            position: absolute; bottom: 30px; right: 60px;
            text-align: right;
            font-family: 'Share Tech Mono'; font-size: 10px; color: rgba(255,255,255,0.3);
            pointer-events: none; letter-spacing: 2px;
            opacity: 0;
            animation: fadeInDown 1s ease 2.8s forwards; 
        }

    </style>
</head>

        },

            stars: [{x:0,y:-0.6,s:3.0,main:true},{x:-0.2,y:-0.3,s:1.5},{x:-0.2,y:0.3,s:1.8},{x:0.2,y:0.3,s:1.8},{x:0.2,y:-0.3,s:1.8}],

    const UNCHARTED = [
        {

            x: 0.05, y: 0.1, scale: 60,
            stars: [{x:-0.2,y:-0.5,s:1.2},{x:0.2,y:-0.5,s:1.2},{x:-0.2,y:0.5,s:1.2},{x:0.2,y:0.5,s:1.2}],

        },

            name: "VIRGO", constellation: "VIRGO", code: "UNCHARTED", status: 'locked', desc: "Unexplored.", type: 'background',
            x: 0.95, y: 0.5, scale: 55,
            stars: [{x:0,y:0,s:1.2},{x:-0.3,y:-0.3,s:1.2},{x:0.3,y:-0.3,s:1.2},{x:0,y:0.4,s:1.2},{x:0.4,y:0.1,s:1.2}],

        },

            x: 0.95, y: 0.9, scale: 50,
            stars: [{x:-0.4,y:-0.2,s:1.2},{x:0,y:0.3,s:1.2},{x:0.4,y:-0.2,s:1.2}],
            lines: [[0,1],[1,2],[2,0]] 
        },

            x: 0.05, y: 0.9, scale: 50,
            stars: [{x:-0.5,y:-0.2,s:1.2},{x:-0.2,y:0,s:1.2},{x:0.2,y:-0.2,s:1.2},{x:0.5,y:0,s:1.2}],
            lines: [[0,1],[1,2],[2,3]] 
        }
    ];

    let galaxies = [];
    let nebulaParticles = []; 
    let bgStars = [];
    let bigStars = [];
    let shootingStars = []; 
    let explosions = [];

    // --- VISUAL CLASSES ---

    class NebulaParticle {
        constructor() { this.reset(); }
        reset() {
            const x = Math.random() * width;
            const slope = height * 0.5;
            const diagonal = (x / width) * (height * 0.4);
            const spread = (Math.random() - 0.5) * 500;
            this.x = x; this.y = slope + diagonal + spread;
            this.radius = 50 + Math.random() * 150; 
            const hue = Math.random() > 0.8 ? 260 : 210; 
            const alpha = 0.05 + Math.random() * 0.08; 
            this.color = `hsla(${hue}, ${80+Math.random()*20}%, ${10+Math.random()*20}%, ${alpha})`;
            this.vx = (Math.random() - 0.5) * 0.2;
        }
        update() {
            this.x += this.vx;
            if(this.x<0||this.x>width||this.y<0||this.y>height) this.reset();
        }
        draw() {
            const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
            g.addColorStop(0, this.color); g.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fill();
        }
    }

    class BigStar {
        constructor() {
            this.x = Math.random()*width; this.y = Math.random()*height;
            this.size = 1 + Math.random()*2; this.alpha = Math.random();
            this.speed = 0.01 + Math.random()*0.03;
        }
        draw() {
            this.alpha += this.speed;
            const glow = 0.5 + Math.sin(this.alpha)*0.4;
            ctx.fillStyle = `rgba(220, 240, 255, ${glow})`;
            ctx.shadowBlur = 4; ctx.shadowColor = "#fff";
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    class ExplosionParticle {
        constructor(x, y, power) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = (Math.random() * power) + 0.5;
            this.vx = Math.cos(angle) * speed; 
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0; 
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 2 + 1;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.vx *= 0.95; this.vy *= 0.95; 
            this.life -= this.decay;
        }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life); 
            ctx.fillStyle = this.life > 0.5 ? "#ffffff" : "#aeeeff";
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        }
    }

    class Constellation {
        constructor(data) {
            this.data = data;
            const safeW = width - 260; 
            this.baseX = 260 + data.x * safeW;
            this.baseY = data.y * height;
            this.cx = this.baseX; this.cy = this.baseY;
            this.floatOffset = Math.random() * 100;
            this.hoverLevel = 0;
            this.angle = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() > 0.5 ? 1 : -1) * 0.0001; 
        }
        update() {
            this.cx = this.baseX + Math.sin(time * 0.5 + this.floatOffset) * 15;
            this.cy = this.baseY + Math.cos(time * 0.4 + this.floatOffset) * 15;

            this.angle += this.rotSpeed; 
            const dist = Math.hypot(mouse.x - this.cx, mouse.y - this.cy);
            
            const hitRadius = this.data.scale; 
            if(dist < hitRadius) this.hoverLevel += 0.1; else this.hoverLevel -= 0.05;
            this.hoverLevel = Math.max(0, Math.min(1, this.hoverLevel));
            
            if(this.hoverLevel > 0.8 && currentHover !== this) {
                currentHover = this;
                showCallout(this);
            } else if (this.hoverLevel < 0.1 && currentHover === this) {
                currentHover = null;
                hideCallout();
            }
        }
        draw() {
            const s = this.data.scale; const hl = this.hoverLevel; 
            const isSubject = this.data.type === 'subject';
            const isLocked = this.data.status === 'locked';
            
            let lineOpacity, lineWidth, fontColor, fontSize;

            if (isSubject) {
                if (isLocked) {
                    lineOpacity = 0.15 + hl * 0.2; 
                    lineWidth = 1.0; 
                    fontColor = `rgba(130, 140, 150, ${0.5 + hl * 0.4})`;
                } else {
                    lineOpacity = 0.5 + hl * 0.5; 
                    lineWidth = 2.0; 
                    fontColor = `rgba(255, 255, 255, ${0.8 + hl * 0.2})`;
                }
                fontSize = Math.max(12, s / 10); 
            } else {
                lineOpacity = 0.1 + hl * 0.2; 
                lineWidth = 0.5; 
                fontColor = `rgba(255, 255, 255, ${0.3 + hl * 0.4})`;
                fontSize = Math.max(9, s / 12); 
            }
            
            if(currentHover === this) drawCalloutLine(this);

            const labelYOffset = s * 0.25 + 10; 
            
            ctx.font = `bold ${fontSize}px 'Rajdhani'`; 
            ctx.textAlign = "center";
            ctx.fillStyle = fontColor;
            
            ctx.fillText(this.data.name, this.cx, this.cy + labelYOffset);
            
            if ((isSubject && !isLocked) || hl > 0.1) {
                ctx.fillStyle = isLocked ? `rgba(255, 50, 80, ${0.3 + hl * 0.4})` : `rgba(174, 238, 255, ${0.3 + hl * 0.4})`;
                const crossSize = 4;
                ctx.fillRect(this.cx - crossSize/2, this.cy + labelYOffset - 15, crossSize, 1);
                ctx.fillRect(this.cx - 0.5, this.cy + labelYOffset - 15 - crossSize/2, 1, crossSize);
            }

            ctx.save();
            ctx.translate(this.cx, this.cy);
            ctx.rotate(this.angle);

            ctx.beginPath(); 
            ctx.strokeStyle = `rgba(200, 230, 255, ${lineOpacity})`; 
            ctx.lineWidth = lineWidth; 
            this.data.lines.forEach(l => {
                const p1 = this.data.stars[l[0]]; const p2 = this.data.stars[l[1]];
                ctx.moveTo(p1.x*s, p1.y*s); ctx.lineTo(p2.x*s, p2.y*s);
            });
            ctx.stroke();

            this.data.stars.forEach(star => {
                const sx = star.x*s; const sy = star.y*s;
                const starScale = isSubject ? 1 : 0.6;
                this.drawRealStar(ctx, sx, sy, star.s * starScale, star.main, hl, isSubject, isLocked);
            });
            ctx.restore();
        }

        drawRealStar(ctx, x, y, size, isMain, hoverLevel, isSubject, isLocked) {
            const lockedFactor = isLocked ? 0.6 : 1; 
            const outerR = size * (isMain ? 8 : 4) * (1 + hoverLevel*0.5) * lockedFactor;
            
            let glowAlpha;
            if (isSubject) {
                if (isLocked) glowAlpha = 0.05; 
                else glowAlpha = isMain ? 0.12 : 0.08;
            } else {
                glowAlpha = 0.05;
            }
            
            const g1 = ctx.createRadialGradient(x, y, 0, x, y, outerR);
            g1.addColorStop(0, `rgba(180, 220, 255, ${glowAlpha})`);
            g1.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = g1;
            ctx.beginPath(); ctx.arc(x, y, outerR, 0, Math.PI*2); ctx.fill();

            const innerR = size * 3 * lockedFactor;
            const g2 = ctx.createRadialGradient(x, y, 0, x, y, innerR);
            g2.addColorStop(0, "rgba(255, 255, 255, 0.9)");
            g2.addColorStop(0.3, "rgba(200, 230, 255, 0.4)");
            g2.addColorStop(1, "rgba(200, 230, 255, 0)");
            ctx.fillStyle = g2;
            ctx.beginPath(); ctx.arc(x, y, innerR, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = isLocked ? "#ccc" : "#fff";
            ctx.beginPath(); ctx.arc(x, y, size * 0.8 * lockedFactor, 0, Math.PI*2); ctx.fill();

            const showSpike = (!isLocked && isSubject && isMain) || hoverLevel > 0.5;

            if (showSpike) {
                ctx.globalCompositeOperation = 'lighter';
                const spikeLen = size * (isMain ? 4 : 3) * (1 + hoverLevel);
                const spikeW = 0.8; 
                
                const gH = ctx.createLinearGradient(x - spikeLen, y, x + spikeLen, y);
                gH.addColorStop(0, "transparent");
                gH.addColorStop(0.5, `rgba(255, 255, 255, ${0.8 + hoverLevel * 0.2})`);
                gH.addColorStop(1, "transparent");
                ctx.fillStyle = gH;
                ctx.beginPath(); ctx.rect(x - spikeLen, y - spikeW/2, spikeLen * 2, spikeW); ctx.fill();

                const gV = ctx.createLinearGradient(x, y - spikeLen, x, y + spikeLen);
                gV.addColorStop(0, "transparent");
                gV.addColorStop(0.5, `rgba(255, 255, 255, ${0.8 + hoverLevel * 0.2})`);
                gV.addColorStop(1, "transparent");
                ctx.fillStyle = gV;
                ctx.beginPath(); ctx.rect(x - spikeW/2, y - spikeLen, spikeW, spikeLen * 2); ctx.fill();
                
                ctx.globalCompositeOperation = 'source-over';
            }
        }
    }

    class Star {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random()*width; this.y = Math.random()*height;
            this.size = Math.random()*1.2; this.alpha = 0.2+Math.random()*0.6;
            this.twinkle = Math.random()*0.05;
        }
        update() {
            this.alpha += this.twinkle; if(this.alpha>0.8||this.alpha<0.1) this.twinkle*=-1;
        }
        draw() {
            ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        }
    }
    class ShootingStar {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random()*width; this.y = Math.random()*height*0.5;
            this.len = Math.random()*80+20; this.speed = Math.random()*10+10;
            this.active = false; this.waitTime = new Date().getTime()+Math.random()*5000;
        }
        update() {
            if(this.active) {
                this.x-=this.speed; this.y+=this.speed*0.6;
                if(this.x<0||this.y>height) { this.active=false; this.waitTime=new Date().getTime()+Math.random()*8000; }
            } else if(new Date().getTime()>this.waitTime) { this.reset(); this.active=true; }
        }
        draw() {
            if(!this.active) return;
            ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x+this.len, this.y-this.len*0.6); ctx.stroke();
        }
    }

    // --- SYSTEM FUNCTIONS ---
    function createExplosion(x, y, count, power) {
        for(let i=0; i<count; i++) explosions.push(new ExplosionParticle(x, y, power));
    }

    function init() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;

        galaxies = [];
        SUBJECTS.forEach(d => galaxies.push(new Constellation(d)));
        UNCHARTED.forEach(d => galaxies.push(new Constellation(d)));

        nebulaParticles = []; for(let i=0; i<60; i++) nebulaParticles.push(new NebulaParticle());
        bgStars = []; for(let i=0; i<400; i++) bgStars.push({x:Math.random()*width,y:Math.random()*height,z:Math.random(),s:Math.random()*1.2});
        bigStars = []; for(let i=0; i<20; i++) bigStars.push(new BigStar());
        shootingStars = []; for(let i=0; i<4; i++) shootingStars.push(new ShootingStar());
    }

    function animate() {
        time += 0.01;
        ctx.clearRect(0, 0, width, height);

        // 鼠标形状逻辑
        if(currentHover && currentHover.data.type === 'subject') {
            document.body.style.cursor = 'pointer';
        } else {
            document.body.style.cursor = 'default';
        }

        ctx.globalCompositeOperation = 'screen';
        nebulaParticles.forEach(p => { p.update(); p.draw(); });
        ctx.globalCompositeOperation = 'source-over';

        ctx.fillStyle = "rgba(200, 220, 255, 0.5)";
        bgStars.forEach(s => {
            ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
        });
        bigStars.forEach(bs => bs.draw());
        shootingStars.forEach(s => { s.update(); s.draw(); });

        galaxies.forEach(g => { g.update(); g.draw(); });

        for(let i = explosions.length - 1; i >= 0; i--) {
            const e = explosions[i]; e.update(); e.draw();
            if(e.life <= 0) explosions.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }

    function drawCalloutLine(g) {
        const cardRect = hoverCard.getBoundingClientRect();
        const endX = cardRect.left; const endY = cardRect.top + 30;
        
        ctx.beginPath();
        ctx.strokeStyle = "rgba(180, 225, 255, 0.4)"; 
        ctx.lineWidth = 1;
        const bottomY = g.cy + (g.data.scale * 0.25) + 20; 
        ctx.moveTo(g.cx, bottomY); ctx.lineTo(g.cx, bottomY + 20); ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(g.cx, bottomY, 2, 0, Math.PI*2); ctx.fill();
    }

    function showCallout(g) {
        const d = g.data;
        hcTitle.innerText = d.name; hcCode.innerText = d.code; hcDesc.innerText = d.desc;
        if (d.status === 'active') {
            hcStatus.innerText = "ONLINE"; hcStatus.className = "status-badge active";
            hcActions.innerHTML = `<div class="action-tag active" data-id="${d.id}">ENTER LAB</div>`;
        } else {
            hcStatus.innerText = "LOCKED"; hcStatus.className = "status-badge";
            hcActions.innerHTML = `<div class="action-tag">RESTRICTED</div>`;
        }
        
        let left = g.cx + 120; let top = g.cy - 100;
        if(left + 350 > width) left = g.cx - 420; 
        if(top + 200 > height) top = height - 250;
        
        hoverCard.style.left = left + 'px'; hoverCard.style.top = top + 'px';
        hoverCard.classList.add('active');
    }

    function hideCallout() { hoverCard.classList.remove('active'); }

    window.addEventListener('resize', init);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    
    window.addEventListener('mousedown', e => {
        let hit = false;
        galaxies.forEach(g => {
            const dist = Math.hypot(e.clientX - g.cx, e.clientY - g.cy);
            const hitR = g.data.scale; 
            if(dist < hitR) {
                createExplosion(g.cx, g.cy, 30, 4); hit = true;
                if(g.data.status === 'active') triggerLabEntry(g.data.id);
            }
        });
        if(!hit) createExplosion(e.clientX, e.clientY, 10, 2);
    });

    window.warpOut = function() {
        document.body.classList.add('warping-out');
        setTimeout(() => window.location.href = "index.html", 800);
    }

    // [MODIFIED] 缩小坍缩跳转 logic
    window.triggerLabEntry = function(id) {
        
        // 1. 触发坍缩动画
        document.body.classList.add('warping-out');

        // 2. 750毫秒后跳转
        setTimeout(() => {
            if(id === 'MATH') {
                window.location.href = "ignite_math_lab/Splash_Math_Lab.html";
            } else if(id === 'BIO') {
                 console.log("Entering Bio Lab...");
            } else if(id === 'CS') {
                 // ...
            } else if(id === 'ENG') {
                 // ...
            }
            if(id !== 'MATH') window.location.reload(); 
        }, 750);
    }

    init();
    animate();

</script>
